  async function open(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(IV) }, key, u8(DATA));

    document.open(); document.write(html); document.close();
  }
  const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err');

  try { const saved = localStorage.getItem('vroum-acces'); if (saved) { pw.value = saved; f.requestSubmit ? f.requestSubmit() : open(saved).catch(() => {}); } } catch (x) {}
